<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Security Grid</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: black; overflow: hidden; height: 100%; }
    body.idle { cursor: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-template-rows: repeat(2, minmax(0, 1fr));
      height: 100vh;
      width: 100vw;
      gap: 2px;
      background: black;
    }
    .grid.all .top-stream { grid-column: span 2; }
    video { width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: cover; background: #111; display: block; }
    .grid.multi video { cursor: zoom-in; }
    .grid:not(.multi) video { cursor: zoom-out; }
    .grid.focused video { object-fit: contain; background: black; }
    .grid.crop video { object-fit: cover; }
    video.hidden { display: none; }

    /* Floating navbar: invisible until the mouse moves, so headless displays never see it */
    nav {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translate(-50%, -6px);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      padding: 4px;
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      font: 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 10;
      max-width: calc(100vw - 16px);
    }
    body.active nav, nav:hover { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
    nav a {
      color: #ddd;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 5px;
      white-space: nowrap;
    }
    nav a:hover { background: rgba(255, 255, 255, 0.12); color: white; }
    nav a.current { background: rgba(255, 255, 255, 0.22); color: white; }
    nav .sep { width: 1px; margin: 3px 4px; background: rgba(255, 255, 255, 0.2); }

    /* Camera label shown in focused views while the nav is visible */
    .label {
      position: fixed;
      color: white;
      font: 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: rgba(0, 0, 0, 0.55);
      padding: 4px 8px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    body.active .label { opacity: 1; }
  </style>
</head>
<body>
<nav id="nav"></nav>

<div class="grid all" id="grid">
  <video id="garageOut" class="top-stream" autoplay playsinline muted></video>
  <video id="garage" class="top-stream" autoplay playsinline muted></video>
  <video id="front" autoplay playsinline muted></video>
  <video id="back" autoplay playsinline muted></video>
  <video id="side" autoplay playsinline muted></video>
  <video id="doorbell" autoplay playsinline muted></video>
</div>

<script>
  const PAGE_REFRESH_MS   = 60 * 60 * 1000; // full reload every hour
  const REVERT_MS        = 10 * 60 * 1000; // inactivity before returning to the default view
  const NAV_HIDE_MS       = 3000;           // nav fades after this much mouse stillness

  const CAMS = {
    garageOut: 'Garage Out',
    garage:    'Garage',
    front:     'Front',
    back:      'Back',
    side:      'Side',
    doorbell:  'Doorbell',
  };

  // Group views, laid out as rows of cameras. Each row splits the width evenly,
  // unless an entry is [id, weight] — e.g. ['a', ['b', 3], 'c'] gives 20/60/20.
  // "All" uses the fixed CSS layout instead. Single-camera views are generated from CAMS.
  const GROUPS = {
    all:          { label: 'All' },
    garageOutBack:{ label: 'Garage + Backyard', crop: true, rows: [['garageOut'], ['back']] },
    frontSide:    { label: 'Front + Side',      crop: true, rows: [['front'], ['side']] },
    quad:         { label: 'Quad',              crop: true, rows: [['garageOut', 'back'], ['front', 'doorbell']] },
    surround:     { label: 'Surround',          crop: true, rows: [['garageOut', 'back'], ['garage', ['doorbell', 2.5], 'side']] },
  };

  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const lcm = (a, b) => (a * b) / gcd(a, b);

  // Turn a view's rows into grid placements: the grid gets enough columns for
  // every row's total weight to divide evenly (e.g. weights 1+1 and 1+3+1 -> 10 columns).
  function placementsOf(view) {
    const rows = view.rows.map(row =>
      row.map(e => (typeof e === 'string' ? { id: e, w: 1 } : { id: e[0], w: e[1] })));
    const cols = rows.map(r => r.reduce((s, t) => s + t.w, 0)).reduce(lcm, 1);
    const tiles = [];
    rows.forEach((row, r) => {
      const unit = cols / row.reduce((s, t) => s + t.w, 0);
      let col = 0;
      for (const t of row) {
        tiles.push({ id: t.id, row: r, col, span: t.w * unit });
        col += t.w * unit;
      }
    });
    return { cols, rows: rows.length, tiles };
  }

  // Shown when the URL has no (or an unknown) #view, and after inactivity
  const DEFAULT_VIEW = 'surround';

  function viewFor(name) {
    if (GROUPS[name]) return GROUPS[name];
    if (CAMS[name]) return { label: CAMS[name], rows: [[name]] };
    return GROUPS[DEFAULT_VIEW];
  }

  function currentViewName() {
    const h = location.hash.slice(1);
    return GROUPS[h] || CAMS[h] ? h : DEFAULT_VIEW;
  }

  function goToDefault() {
    history.replaceState(null, '', location.pathname + location.search);
    applyView();
  }

  // ---------- Navbar ----------
  const nav = document.getElementById('nav');
  function addLink(view, label) {
    const a = document.createElement('a');
    a.href = '#' + view;
    a.textContent = label;
    a.dataset.view = view;
    nav.appendChild(a);
  }
  function addSep() {
    const s = document.createElement('span');
    s.className = 'sep';
    nav.appendChild(s);
  }
  for (const [k, g] of Object.entries(GROUPS)) addLink(k, g.label);
  addSep();
  // Then every camera individually
  for (const [k, label] of Object.entries(CAMS)) addLink(k, label);

  // ---------- Layout ----------
  const grid = document.getElementById('grid');
  let labels = [];

  function applyView() {
    const name = currentViewName();
    const view = viewFor(name);
    const isAll = view === GROUPS.all;

    grid.classList.toggle('all', isAll);
    grid.classList.toggle('multi', isAll || view.rows.flat().length > 1);
    grid.classList.toggle('focused', !isAll);
    grid.classList.toggle('crop', !!view.crop);
    const layout = isAll ? null : placementsOf(view);
    grid.style.gridTemplateColumns = isAll ? '' : `repeat(${layout.cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows    = isAll ? '' : `repeat(${layout.rows}, minmax(0, 1fr))`;

    // Place + show/hide (streams stay connected so switching is instant)
    for (const id of Object.keys(CAMS)) {
      const el = document.getElementById(id);
      const tile = isAll ? null : layout.tiles.find(t => t.id === id);
      el.classList.toggle('hidden', !isAll && !tile);
      el.style.gridRow    = tile ? `${tile.row + 1}` : '';
      el.style.gridColumn = tile ? `${tile.col + 1} / span ${tile.span}` : '';
    }

    for (const a of nav.querySelectorAll('a')) {
      a.classList.toggle('current', a.dataset.view === name);
    }

    // Labels on focused multi-camera views
    labels.forEach(l => l.remove());
    labels = [];
    if (!isAll && layout.tiles.length > 1) {
      for (const t of layout.tiles) {
        const l = document.createElement('div');
        l.className = 'label';
        l.textContent = CAMS[t.id];
        l.style.left = `calc(${(100 / layout.cols) * t.col}% + 8px)`;
        l.style.bottom = `calc(${(100 / layout.rows) * (layout.rows - 1 - t.row)}% + 8px)`;
        document.body.appendChild(l);
        labels.push(l);
      }
    }
  }
  window.addEventListener('hashchange', applyView);

  // Click a tile in any multi-camera view to fill the screen with it; click the
  // full-screen camera again to go back to the layout you came from.
  let returnTo = null; // hash of the layout to restore ('' = default view)
  grid.addEventListener('click', (e) => {
    if (e.target.tagName !== 'VIDEO') return;
    if (grid.classList.contains('multi')) {
      returnTo = location.hash;
      location.hash = e.target.id;
    } else {
      const back = returnTo;
      returnTo = null;
      if (back) location.hash = back;
      else goToDefault();
    }
  });

  // ---------- Activity tracking ----------
  let navTimer, revertTimer;
  function onActivity() {
    document.body.classList.add('active');
    document.body.classList.remove('idle');
    clearTimeout(navTimer);
    navTimer = setTimeout(() => {
      document.body.classList.remove('active');
      document.body.classList.add('idle');
    }, NAV_HIDE_MS);

    clearTimeout(revertTimer);
    revertTimer = setTimeout(() => {
      if (location.hash) goToDefault();
    }, REVERT_MS);
  }
  ['mousemove', 'mousedown', 'keydown', 'wheel', 'touchstart'].forEach(ev =>
    window.addEventListener(ev, onActivity, { passive: true }));

  // Keyboard shortcuts: 0/Esc = default view, 1-6 = individual cameras
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' || e.key === '0') { goToDefault(); return; }
    const n = parseInt(e.key, 10);
    const ids = Object.keys(CAMS);
    if (n >= 1 && n <= ids.length) location.hash = ids[n - 1];
  });

  // Hourly full reload (keeps the current view; inactivity revert still applies)
  setTimeout(() => location.reload(), PAGE_REFRESH_MS);

  // ---------- Streams ----------
  async function startStream(camId) {
    try {
      const pc = new RTCPeerConnection();
      pc.ontrack = (event) => {
        const el = document.getElementById(camId);
        if (el && event.streams[0]) {
          el.srcObject = event.streams[0];
        }
      };
      pc.addTransceiver('video', { direction: 'recvonly' });

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);

      const response = await fetch(`/api/webrtc?src=${camId}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/sdp' },
        body: offer.sdp
      });

      if (response.ok) {
        const answerSdp = await response.text();
        await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
      }
    } catch (err) {
      console.error(`Failed to connect ${camId}:`, err);
    }
  }

  applyView();
  Object.keys(CAMS).forEach(startStream);
</script>
</body>
</html>
