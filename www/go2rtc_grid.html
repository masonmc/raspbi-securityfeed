</head>

    <iframe src="http://127.0.0.1:1984/stream.html?src=cam3"></iframe>
    <iframe src="http://127.0.0.1:1984/stream.html?src=cam4"></iframe>
    <iframe src="http://127.0.0.1:1984/stream.html?src=cam5"></iframe>
    <iframe src="http://127.0.0.1:1984/stream.html?src=cam6"></iframe>
  </div>
</body>
</html>
